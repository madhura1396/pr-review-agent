name: PR Review Agent CI

on:
  push:
    branches:
      - main
  pull_request:
  # Lets you run the live evals on demand from the Actions tab.
  workflow_dispatch:
  schedule:
    # 06:00 UTC nightly. Scheduled runs only fire on the default branch.
    - cron: "0 6 * * *"

jobs:
  # Fast lane: no API key, no tokens, runs on every push and PR.
  checks:
    name: Syntax and offline tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          find agents/ tools/ graph/ prompts/ evals/ -name "*.py" \
            | xargs python -m py_compile
          python -m py_compile config.py main.py

      - name: Run offline tests
        # Everything not marked `llm` — no Groq calls, so no secret needed.
        run: pytest evals/ -m "not llm" -v

  # Slow lane: calls live models, costs tokens. Manual or nightly only.
  evals:
    name: LLM evals
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the Groq secret is present
        # Without this the suite would skip all 12 evals and still report
        # success, which looks identical to a green run that actually tested
        # something. Fail loudly instead.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "GROQ_API_KEY is set (${#GROQ_API_KEY} chars)."

      - name: Run LLM evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest evals/ -m llm -v
